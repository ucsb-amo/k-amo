[project]
name = "kamo"
version = "0.0.1"
description = "K team AMO functions, modeling, and simulations"
authors = [
    {name = "jpagett", email = "pagett.jared@gmail.com"},
    {name = "Jared Pagett", email = "pagett.jared@gmail.com"},
]
dependencies = [
    "arc",
    "numpy",
    "pandas",
    "scipy",
    "sympy",
    "matplotlib",
]
requires-python = "==3.13.*"
readme = "README.md"
license = {text = "MIT"}


[project.urls]
Homepage = "https://github.com/ucsb-amo/k-amo"
[tool.pdm]
distribution = false

[tool.pytest.ini_options]
markers = ["slow: multi-second solves on the real tweezer; run with -m slow or deselect with -m 'not slow'"]
